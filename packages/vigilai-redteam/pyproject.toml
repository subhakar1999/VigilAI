[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigilai-redteam"
version = "0.1.0"
description = "Deterministic dynamic security assessment worker for AI agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
vigilai-redteam = "redteam.daemon:app"

[tool.hatch.build.targets.wheel]
packages = ["redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1713" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>

    <!-- Lime Phosphor Glow -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9fb7f" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#c7f36a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- High-Contrast Squircle Badge (Ensures clear visibility on light and dark browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#c7f36a" stroke-width="2" stroke-opacity="0.45" />

  <!-- Outer Hexagonal Cyber Shield -->
  <polygon
    points="32,9 52,20.5 52,43.5 32,55 12,43.5 12,20.5"
    fill="#c7f36a"
    fill-opacity="0.14"
    stroke="url(#limeGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Sentinel Chevron / V-Symbol for VigilAI -->
  <path
    d="M 21.5 24.5 L 32 40 L 42.5 24.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Cyber Eye / AI Sentinel Core Node -->
  <circle cx="32" cy="27" r="4.5" fill="#c7f36a" />
  <circle cx="32" cy="27" r="2" fill="#ffffff" />
</svg>

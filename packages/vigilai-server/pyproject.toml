[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigilai-server"
version = "0.1.0"
description = "VigilAI control plane and quality gate API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111,<1", "httpx>=0.27,<1", "pydantic>=2.7,<3", "sqlmodel>=0.0.21,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]


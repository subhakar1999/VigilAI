[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigilai-test-agents"
version = "0.1.0"
description = "Deterministic local agents for VigilAI discovery and red-team validation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.hatch.build.targets.wheel]
packages = ["test_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
